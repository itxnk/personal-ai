# Private, self-hosted ChatGPT-style assistant.
# Ollama (local LLM) + Open WebUI (chat UI + RAG over your documents) + Caddy (HTTPS).
# Only Caddy is reachable, and only from this machine (127.0.0.1).

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  ollama:
    <<: *hardening
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    networks: [backend]
    # No published ports: only other containers can reach it.
    # NVIDIA GPU (uncomment if you have one + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    <<: *hardening
    image: ghcr.io/open-webui/open-webui:main
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENABLE_SIGNUP: "false"            # nobody can self-register
      ENABLE_OPENAI_API: "false"        # nothing leaves your machine
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBED_MODEL}
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
    volumes:
      - ./data/webui:/app/backend/data
    networks: [backend, frontend]
    # No published ports: reached only through Caddy.

  caddy:
    <<: *hardening
    image: caddy:2
    depends_on: [open-webui]
    ports:
      - "127.0.0.1:8443:443"           # localhost only. Use a VPN (WireGuard/Tailscale) for remote access.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    networks: [frontend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  backend: {}
  frontend: {}
