# Private, self-hosted ChatGPT-style personal assistant.
# Ollama + Open WebUI/RAG + Assistant API tools + Caddy HTTPS.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  ollama:
    <<: *hardening
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    networks: [backend]

  open-webui:
    <<: *hardening
    image: ghcr.io/open-webui/open-webui:main
    depends_on: [ollama, assistant-api]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENABLE_SIGNUP: "false"
      ENABLE_OPENAI_API: "false"
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBED_MODEL}
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      # Register the local Personal Assistant API as an OpenAPI tool server.
      # Open WebUI reaches it over the Docker network; do not use localhost here.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"openapi","url":"http://assistant-api:8090","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"personal_assistant","name":"Personal Assistant","description":"Personal reminders, tasks, agenda, calendar events, due notifications, and phone-call preparation."}}]
    volumes:
      - ./data/webui:/app/backend/data
    networks: [backend, frontend]

  assistant-api:
    <<: *hardening
    build:
      context: ./assistant-api
    volumes:
      - ./data/assistant:/app/data
    ports:
      - "127.0.0.1:8090:8090"
    networks: [backend, frontend]

  caddy:
    <<: *hardening
    image: caddy:2
    depends_on: [open-webui, assistant-api]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    networks: [frontend]

networks:
  backend: {}
  frontend: {}
